<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeni Şifre — LimitChest</title>
<link rel="icon" type="image/svg+xml" href="logo/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase-min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js" defer></script>
</head>
<body>

<nav class="navbar">
  <div class="nav-container container">
    <a href="index.html" class="nav-brand">⚡ LimitChest</a>
    <span id="nav-auth-area"></span>
  </div>
</nav>

<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Yeni şifre belirle</h1>
    <p class="auth-sub">Aşağıya yeni şifreni gir.</p>

    <div id="rs-error" class="form-error" style="display:none;"></div>
    <div id="rs-success" class="form-success" style="display:none;"></div>

    <form id="rs-form">
      <div class="form-field">
        <label for="password">Yeni şifre * <small style="color:var(--text-muted); font-weight:400;">(en az 8 karakter)</small></label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
      </div>
      <div class="form-field">
        <label for="password2">Şifre tekrar *</label>
        <input type="password" id="password2" required autocomplete="new-password" placeholder="••••••••">
      </div>
      <button type="submit" id="rs-btn" class="btn btn-primary btn-lg" style="width:100%;">Şifreyi Güncelle</button>
    </form>

    <div class="auth-alt"><a href="login.html">← Girişe dön</a></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('rs-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('rs-error');
    const okBox  = document.getElementById('rs-success');
    const btn    = document.getElementById('rs-btn');
    errBox.style.display = 'none'; okBox.style.display = 'none';

    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('password2').value;
    if (p1 !== p2) {
      errBox.textContent = 'Şifreler eşleşmiyor.';
      errBox.style.display = 'block';
      return;
    }

    btn.disabled = true; btn.textContent = 'Güncelleniyor…';
    const { error } = await sb.auth.updateUser({ password: p1 });

    if (error) {
      errBox.textContent = 'Hata: ' + error.message;
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Şifreyi Güncelle';
      return;
    }
    okBox.textContent = '✅ Şifre güncellendi. Giriş sayfasına yönlendiriliyorsun…';
    okBox.style.display = 'block';
    setTimeout(() => location.href = 'login.html', 1800);
  });
});
</script>

</body>
</html>
