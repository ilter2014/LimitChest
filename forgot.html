<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Şifremi Unuttum — LimitChest</title>
<link rel="icon" type="image/svg+xml" href="logo/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase-min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js" defer></script>
</head>
<body>

<nav class="navbar">
  <div class="nav-container container">
    <a href="index.html" class="nav-brand">⚡ LimitChest</a>
    <button class="nav-toggle" aria-label="Menü" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
    <div class="nav-links">
      <a href="index.html#features">Özellikler</a>
      <a href="index.html#pricing">Fiyatlandırma</a>
      <a href="index.html#install">Kurulum</a>
      <a href="community.html">Topluluk</a>
      <a href="support.html">Destek</a>
      <span id="nav-auth-area"></span>
    </div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="card auth-card">
    <h1>Şifremi unuttum</h1>
    <p class="auth-sub">E-postanı gir, sıfırlama bağlantısı gönderelim.</p>

    <div id="fp-error" class="form-error" style="display:none;"></div>
    <div id="fp-success" class="form-success" style="display:none;"></div>

    <form id="fp-form">
      <div class="form-field">
        <label for="email">E-posta</label>
        <input type="email" id="email" required autocomplete="email" placeholder="ornek@mail.com">
      </div>
      <button type="submit" id="fp-btn" class="btn btn-primary btn-lg" style="width:100%;">Sıfırlama Bağlantısı Gönder</button>
    </form>

    <div class="auth-alt"><a href="login.html">← Girişe dön</a></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('fp-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('fp-error');
    const okBox  = document.getElementById('fp-success');
    const btn    = document.getElementById('fp-btn');
    errBox.style.display = 'none'; okBox.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Gönderiliyor…';

    const email = document.getElementById('email').value.trim();
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname.replace('forgot.html', 'reset.html')
    });

    if (error) {
      errBox.textContent = 'Hata: ' + error.message;
      errBox.style.display = 'block';
    } else {
      okBox.textContent = '✅ Sıfırlama bağlantısı e-postana gönderildi. Gelen kutunu kontrol et.';
      okBox.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Sıfırlama Bağlantısı Gönder';
  });
});
</script>

</body>
</html>
